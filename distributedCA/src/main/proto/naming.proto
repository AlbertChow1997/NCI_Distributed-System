syntax = "proto3";
package SDG.Naming;

option java_multiple_files = true;
option java_package = "generated.grpc.naming";
option java_outer_classname = "NamingProto";

message ServiceInfo {
  string service_name = 1;
  string host = 2;
  int32 port = 3;
  string version = 4;
  repeated string capabilities = 5;
  map<string, string> metadata = 6;
}

message RegisterReply{
  bool ok = 1;
  string message = 2;
}
